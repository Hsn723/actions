name: Update tags
on:
  workflow_call:
    inputs:
      create_release_pr:
        description: "Whether to create a release PR for the next tag"
        required: false
        type: boolean
        default: false
    outputs:
      tag_updated:
        description: "Whether a new tag was created or an existing tag was updated"
        value: ${{ jobs.update-tags.outputs.tag_updated }}
  push:
    branches:
      - master
    paths:
      - VERSION
permissions:
  contents: write
env:
  GH_TELEMETRY: false
  DO_NOT_TRACK: true
jobs:
  version:
    uses: ./.github/workflows/read-version.yml
  update-tags:
    runs-on: ubuntu-latest
    needs: version
    outputs:
      tag_updated: ${{ steps.update-tags.outputs.tag_updated }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Update tags
        run: |
          TAG="${{ needs.version.outputs.version-tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping tag creation"
            exit 0
          fi
          git tag "$TAG"
      - name: Push tags
        run: |
          git push origin --tags --force
          echo "tag_updated=true" >> $GITHUB_OUTPUT
  create-release-pr:
    permissions:
      contents: write
      pull-requests: write
    if: ${{ github.event_name == 'workflow_call' && inputs.create_release_pr }} && needs.update-tags.outputs.tag_updated == 'true'
    needs: update-tags
    uses: ./.github/workflows/create-release-pr.yml
