name: Release Helm chart
on:
  workflow_call:
    inputs:
      extra_helm_setup:
        required: false
        type: string
        default: ""
      upload_as_oci:
        description: deprecated
        required: false
        type: boolean
        default: true
      chart_name:
        required: true
        type: string
        default: ""
      artifact_directory:
        required: false
        type: string
        default: "dist"
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
env:
  GH_TELEMETRY: false
  DO_NOT_TRACK: true
  ORAS_VERSION: 1.3.0
  SYFT_VERSION: 1.44.0
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Configure Git
        run: |
            git config user.name "$GITHUB_ACTOR"
            git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
      - name: Extra Helm setup
        if: ${{ inputs.extra_helm_setup != '' }}
        run: |
          set -euo pipefail
          ${{ inputs.extra_helm_setup }}
        shell: bash
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: stable
      - name: Retrieve chart version
        id: version
        run: |
          VERSION=$(yq '.version' charts/${{ inputs.chart_name }}/Chart.yaml)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Check for release necessity
        id: check_release
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          CHART_PATH="ghcr.io/${OWNER}/charts/${{ inputs.chart_name }}"
          if helm show chart oci://${CHART_PATH} --version "${{ steps.version.outputs.version }}"> /dev/null 2>&1; then
            echo "Chart version ${VERSION} already exists, skipping release"
            echo "release=false" >> $GITHUB_OUTPUT
          else
            echo "Chart version ${VERSION} does not exist, proceeding with release"
            echo "release=true" >> $GITHUB_OUTPUT
            echo "chart_uri=${CHART_PATH}:${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
          fi
      - name: Package chart
        if: ${{ steps.check_release.outputs.release == 'true' }}
        id: package
        run: |
          mkdir -p ${{ inputs.artifact_directory }}
          helm package charts/${{ inputs.chart_name }} -d ${{ inputs.artifact_directory }}
          echo "chart_file=${{ inputs.artifact_directory }}/${{ inputs.chart_name }}-${{ steps.version.outputs.version }}.tgz" >> $GITHUB_OUTPUT
      - name: Push chart to GHCR
        if: ${{ steps.check_release.outputs.release == 'true' }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm push ${{ steps.package.outputs.chart_file }} oci://ghcr.io/${OWNER}/charts
      - name: Install cosign
        if: ${{ steps.check_release.outputs.release == 'true' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install syft
        if: ${{ steps.check_release.outputs.release == 'true' }}
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v${{ env.SYFT_VERSION }}
      - name: Install oras
        if: ${{ steps.check_release.outputs.release == 'true' }}
        run: go install oras.land/oras/cmd/oras@v${{ env.ORAS_VERSION }}
      - name: Login to GHCR
        if: ${{ steps.check_release.outputs.release == 'true' }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign chart
        if: ${{ steps.check_release.outputs.release == 'true' }}
        run: |
          cosign sign --yes ${{ steps.check_release.outputs.chart_uri }}
      - name: Generate SBOM
        id: generate_sbom
        if: ${{ steps.check_release.outputs.release == 'true' }}
        run: |
          SBOM_FILE="${{ inputs.artifact_directory }}/${{ inputs.chart_name }}-${{ steps.version.outputs.version }}-sbom.spdx.json"
          syft ${{ steps.package.outputs.chart_file }} \
            -o spdx-json > "$SBOM_FILE"
          echo "sbom_file=$SBOM_FILE" >> $GITHUB_OUTPUT
      - name: Attach SBOM
        if: ${{ steps.check_release.outputs.release == 'true' }}
        run: |
          oras attach --artifact-type application/spdx+json \
            ${{ steps.check_release.outputs.chart_uri }} \
            "${{ steps.generate_sbom.outputs.sbom_file }}:application/spdx+json"
      - name: Sign SBOM attestation
        if: ${{ steps.check_release.outputs.release == 'true' }}
        run: |
          cosign attest --yes --predicate "${{ steps.generate_sbom.outputs.sbom_file }}" \
            --type spdx \
            ${{ steps.check_release.outputs.chart_uri }}
