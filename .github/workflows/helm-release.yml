name: Release Helm chart
on:
  workflow_call:
    inputs:
      extra_helm_setup:
        required: false
        type: string
        default: ""
      upload_as_oci:
        required: false
        type: boolean
        default: false
      chart_name:
        required: false
        type: string
        default: ""
      artifact_directory:
        required: false
        type: string
        default: "dist"
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
env:
  GH_TELEMETRY: false
  DO_NOT_TRACK: true
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Configure Git
        run: |
            git config user.name "$GITHUB_ACTOR"
            git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Install Helm
        uses: azure/setup-helm@v5
      - name: Extra Helm setup
        if: ${{ inputs.extra_helm_setup != '' }}
        run: |
          set -euo pipefail
          ${{ inputs.extra_helm_setup }}
        shell: bash
      # TODO: Remove once https://github.com/helm/chart-releaser/pull/587 is merged and released
      - uses: actions/setup-go@v6
        if: ${{ inputs.upload_as_oci == false }}
      - name: Build interim chart-releaser
        if: ${{ inputs.upload_as_oci == false }}
        run: |
          curl -sSL -o chart-releaser.tar.gz "https://github.com/helm/chart-releaser/archive/refs/tags/v1.8.1.tar.gz"
          tar -xzf chart-releaser.tar.gz
          cd chart-releaser-1.8.1
          curl -sSL -o de894ed.patch "https://github.com/chrisburr/chart-releaser/commit/de894ed8f6e7c0678eb71445d48b215ea167823b.patch"
          curl -sSL -o 7a93a55.patch "https://github.com/chrisburr/chart-releaser/commit/7a93a55f636493c7a39d7b57fbd650ee95bfa233.patch"
          patch -p1 < de894ed.patch
          patch -p1 < 7a93a55.patch
          go build -o ${{ runner.tool_cache }}/cr/patched/cr ./cr
          chmod +x ${{ runner.tool_cache }}/cr/patched/cr
      # End TODO
      - name: Run chart-releaser
        if: ${{ inputs.upload_as_oci == false }}
        uses: helm/chart-releaser-action@v1.7.0
        with:
          mark_as_latest: false
          skip_existing: true
          install_dir: ${{ runner.tool_cache }}/cr/patched # TODO: Remove once https://github.com/helm/chart-releaser/pull/587 is merged and released
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_RELEASE_NAME_TEMPLATE: "helm-v{{ .Version }}"
      - name: Retrieve chart version
        id: version
        if: ${{ inputs.upload_as_oci == true && inputs.chart_name != '' }}
        run: |
          VERSION=$(yq '.version' charts/${{ inputs.chart_name }}/Chart.yaml)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
      - name: Login to GHCR
        if: ${{ inputs.upload_as_oci == true && inputs.chart_name != '' }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Check for release necessity
        id: check_release
        if: ${{ inputs.upload_as_oci == true && inputs.chart_name != '' }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          CHART_PATH="ghcr.io/${OWNER}/charts/${{ inputs.chart_name }}"
          if helm show chart oci://${CHART_PATH} --version "${{ steps.version.outputs.version }}"> /dev/null 2>&1; then
            echo "Chart version ${VERSION} already exists, skipping release"
            echo "release=false" >> $GITHUB_OUTPUT
          else
            echo "Chart version ${VERSION} does not exist, proceeding with release"
            echo "release=true" >> $GITHUB_OUTPUT
            echo "chart_uri=${CHART_PATH}:${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
          fi
      - name: Package chart
        if: ${{ inputs.upload_as_oci == true && steps.check_release.outputs.release == 'true' }}
        run: |
          mkdir -p ${{ inputs.artifact_directory }}
          helm package charts/${{ inputs.chart_name }} -d ${{ inputs.artifact_directory }}
      - name: Push chart to GHCR
        if: ${{ inputs.upload_as_oci == true && steps.check_release.outputs.release == 'true' }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm push ${{ inputs.artifact_directory }}/${{ inputs.chart_name }}-${{ steps.version.outputs.version }}.tgz oci://ghcr.io/${OWNER}/charts
      - name: Install cosign
        if: ${{ inputs.upload_as_oci == true && steps.check_release.outputs.release == 'true' }}
        uses: sigstore/cosign-installer@v4.1.2
      - name: Install syft
        if: ${{ inputs.upload_as_oci == true && steps.check_release.outputs.release == 'true' }}
        uses: anchore/sbom-action/download-syft@v0.24.0
      - name: Install oras
        if: ${{ inputs.upload_as_oci == true && steps.check_release.outputs.release == 'true' }}
        run: go install oras.land/oras/cmd/oras@latest
      - name: Sign chart
        if: ${{ inputs.upload_as_oci == true && steps.check_release.outputs.release == 'true' }}
        run: |
          cosign sign --yes ${{ steps.check_release.outputs.chart_uri }}
      - name: Generate SBOM
        id: generate_sbom
        if: ${{ inputs.upload_as_oci == true && steps.check_release.outputs.release == 'true' }}
        run: |
          SBOM_FILE="${{ inputs.artifact_directory }}/${{ inputs.chart_name }}-${{ steps.version.outputs.version }}-sbom.spdx.json"
          syft ${{ steps.check_release.outputs.chart_uri }} \
            -o spdx-json > "$SBOM_FILE"
          echo "sbom_file=$SBOM_FILE" >> $GITHUB_OUTPUT
      - name: Attach SBOM
        if: ${{ inputs.upload_as_oci == true && steps.check_release.outputs.release == 'true' }}
        run: |
          oras attach --artifact-type application/spdx+json \
            ${{ steps.check_release.outputs.chart_uri }} \
            "${{ steps.generate_sbom.outputs.sbom_file }}:application/spdx+json"
      - name: Sign SBOM attestation
        if: ${{ inputs.upload_as_oci == true && steps.check_release.outputs.release == 'true' }}
        run: |
          cosign attest --yes --predicate "${{ steps.generate_sbom.outputs.sbom_file }}" \
            --type spdx \
            ${{ steps.check_release.outputs.chart_uri }}
