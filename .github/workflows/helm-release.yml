name: Release Helm chart
on:
  workflow_call:
    inputs:
      extra_helm_setup:
        required: false
        type: string
        default: ""
      upload_as_oci:
        description: deprecated
        required: false
        type: boolean
        default: true
      chart_name:
        required: true
        type: string
        default: ""
      artifact_directory:
        required: false
        type: string
        default: "dist"
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
env:
  GH_TELEMETRY: false
  DO_NOT_TRACK: true
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: hsn723/actions/.github/actions/setup-aqua@master
      - name: Extra Helm setup
        if: ${{ inputs.extra_helm_setup != '' }}
        run: |
          set -euo pipefail
          ${{ inputs.extra_helm_setup }}
        shell: bash
      - name: Retrieve chart version
        id: version
        run: |
          VERSION=$(yq '.version' charts/${{ inputs.chart_name }}/Chart.yaml)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
      - name: Login to GHCR
        run: echo "${{ github.token }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Check for release necessity
        id: check_release
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          CHART_PATH="ghcr.io/${OWNER}/charts/${{ inputs.chart_name }}"
          if helm show chart oci://${CHART_PATH} --version "${{ steps.version.outputs.version }}"> /dev/null 2>&1; then
            echo "Chart version ${VERSION} already exists, skipping release"
            echo "release=false" >> $GITHUB_OUTPUT
          else
            echo "Chart version ${VERSION} does not exist, proceeding with release"
            echo "release=true" >> $GITHUB_OUTPUT
            echo "chart_uri=${CHART_PATH}:${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
          fi
      - name: Package chart
        if: ${{ steps.check_release.outputs.release == 'true' }}
        id: package
        run: |
          mkdir -p ${{ inputs.artifact_directory }}
          helm package charts/${{ inputs.chart_name }} -d ${{ inputs.artifact_directory }}
          echo "chart_file=${{ inputs.artifact_directory }}/${{ inputs.chart_name }}-${{ steps.version.outputs.version }}.tgz" >> $GITHUB_OUTPUT
      - name: Push chart to GHCR
        if: ${{ steps.check_release.outputs.release == 'true' }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm push ${{ steps.package.outputs.chart_file }} oci://ghcr.io/${OWNER}/charts
      - name: Login to GHCR
        if: ${{ steps.check_release.outputs.release == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - name: Sign chart
        if: ${{ steps.check_release.outputs.release == 'true' }}
        run: |
          cosign sign --yes ${{ steps.check_release.outputs.chart_uri }}
      - name: Generate SBOM
        id: generate_sbom
        if: ${{ steps.check_release.outputs.release == 'true' }}
        run: |
          SBOM_FILE="${{ inputs.artifact_directory }}/${{ inputs.chart_name }}-${{ steps.version.outputs.version }}-sbom.spdx.json"
          syft ${{ steps.package.outputs.chart_file }} \
            -o spdx-json > "$SBOM_FILE"
          echo "sbom_file=$SBOM_FILE" >> $GITHUB_OUTPUT
      - name: Attach SBOM
        if: ${{ steps.check_release.outputs.release == 'true' }}
        run: |
          oras attach --artifact-type application/spdx+json \
            ${{ steps.check_release.outputs.chart_uri }} \
            "${{ steps.generate_sbom.outputs.sbom_file }}:application/spdx+json"
      - name: Sign SBOM attestation
        if: ${{ steps.check_release.outputs.release == 'true' }}
        run: |
          cosign attest --yes --predicate "${{ steps.generate_sbom.outputs.sbom_file }}" \
            --type spdx \
            ${{ steps.check_release.outputs.chart_uri }}
