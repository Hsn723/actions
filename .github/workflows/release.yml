name: release
on:
  workflow_call:
    inputs:
      additional-setup:
        description: "Additional setup commands to run before release (e.g. setting up extra tools)"
        required: false
        type: string
        default: ""
      attest-checksums:
        description: "Whether to attest checksums"
        required: false
        type: boolean
        default: true
      attest-digests:
        description: "Whether to attest image digests"
        required: false
        type: boolean
        default: true
      upload-image-sbom:
        description: "Whether to generate and upload SBOM for container images"
        required: false
        type: boolean
        default: true
permissions:
  contents: write
  id-token: write
  packages: write
  attestations: write
env:
  GH_TELEMETRY: false
  DO_NOT_TRACK: true
jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.tag.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Read version
        id: version
        run: |
          if [ ! -f VERSION ]; then
            echo "VERSION file not found!"
            exit 1
          fi
          echo "VERSION=v$(cat VERSION)" >> $GITHUB_OUTPUT
      - name: Check if tag exists
        id: tag
        run: |
          TAG="${{ steps.version.outputs.VERSION }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "release=false" >> $GITHUB_OUTPUT
          else
            echo "release=true" >> $GITHUB_OUTPUT
          fi
      - name: Create tag
        if: steps.tag.outputs.release == 'true'
        run: |
          TAG="${{ steps.version.outputs.VERSION }}"
          git tag "$TAG"
          git push origin "$TAG"
  release:
    runs-on: ubuntu-latest
    needs: tag
    if: needs.tag.outputs.release == 'true'
    env:
      DOCKER_CLI_EXPERIMENTAL: "enabled"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: GHCR Login
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
      - name: Additional setup
        if: ${{ inputs.additional-setup != '' }}
        run: |
          set -euo pipefail
          ${{ inputs.additional-setup }}
        shell: bash
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest checksums
        if: ${{ inputs.attest-checksums }}
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-checksums: ./dist/checksums.txt
      - name: Attest image digests
        if: ${{ inputs.attest-digests }}
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-checksums: ./dist/digests.txt
      - name: Install oras
        if: ${{ inputs.upload-image-sbom }}
        run: go install oras.land/oras/cmd/oras@latest
      - name: Generate and attach container image SBOM
        if: ${{ inputs.upload-image-sbom }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGES=$(jq -r '.[] | select(.type == "Docker Image") | .name' dist/artifacts.json)
          for IMAGE in ${IMAGES}; do
            SBOM_FILE="dist/sbom-$(echo ${IMAGE} | tr '/:' '_').json"
            syft "${IMAGE}" -o spdx-json > "${SBOM_FILE}"
            oras attach --artifact-type application/spdx+json "${IMAGE}" "${SBOM_FILE}:application/spdx+json"
          done
