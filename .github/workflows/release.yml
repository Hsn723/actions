name: release
on:
  workflow_call:
    inputs:
      additional-setup:
        description: "Additional setup commands to run before release (e.g. setting up extra tools)"
        required: false
        type: string
        default: ""
      attest-checksums:
        description: "Whether to attest checksums"
        required: false
        type: boolean
        default: true
      attest-digests:
        description: "Whether to attest image digests"
        required: false
        type: boolean
        default: true
      upload-image-sbom:
        description: "Whether to generate and upload SBOM for container images"
        required: false
        type: boolean
        default: true
permissions:
  contents: write
  id-token: write
  packages: write
  attestations: write
env:
  GH_TELEMETRY: false
  DO_NOT_TRACK: true
jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.tag.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Read version
        id: version
        run: |
          if [ ! -f VERSION ]; then
            echo "VERSION file not found!"
            exit 1
          fi
          echo "VERSION=v$(cat VERSION)" >> $GITHUB_OUTPUT
      - name: Check if tag exists
        id: tag
        run: |
          TAG="${{ steps.version.outputs.VERSION }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "release=false" >> $GITHUB_OUTPUT
          else
            echo "release=true" >> $GITHUB_OUTPUT
          fi
      - name: Create tag
        if: steps.tag.outputs.release == 'true'
        run: |
          TAG="${{ steps.version.outputs.VERSION }}"
          git tag "$TAG"
          git push origin "$TAG"
  release:
    runs-on: ubuntu-latest
    needs: tag
    if: needs.tag.outputs.release == 'true'
    env:
      DOCKER_CLI_EXPERIMENTAL: "enabled"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: hsn723/actions/.github/actions/setup-aqua@master
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: GHCR Login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - name: Additional setup
        if: ${{ inputs.additional-setup != '' }}
        run: |
          set -euo pipefail
          ${{ inputs.additional-setup }}
        shell: bash
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Attest checksums
        if: ${{ inputs.attest-checksums }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: ./dist/checksums.txt
      - name: Attest image digests
        if: ${{ inputs.attest-digests }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: ./dist/digests.txt
      - name: Generate and attach container image SBOM
        if: ${{ inputs.upload-image-sbom }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          IMAGES=$(jq -r '.[] | select(.type == "Docker Image") | .name' dist/artifacts.json)
          for IMAGE in ${IMAGES}; do
            SBOM_FILE="dist/sbom-$(echo ${IMAGE} | tr '/:' '_').json"
            syft "${IMAGE}" -o spdx-json > "${SBOM_FILE}"
            oras attach --artifact-type application/spdx+json "${IMAGE}" "${SBOM_FILE}:application/spdx+json"
          done
