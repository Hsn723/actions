name: Pinact
description: Pinact action
runs:
  using: composite
  steps:
  - name: Setup global config
    shell: bash
    run: |
      echo "PINACT_GLOBAL_CONFIG=${{ github.action_path }}/.pinact.yaml" >> $GITHUB_ENV
  - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
  - uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
    with:
      fix: false
      skip_push: true
      verify: true
      github_token: ${{ github.token }}
